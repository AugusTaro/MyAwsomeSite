name: Deploy to Cloudflare Workers (Production)

on:
  push:
    branches: [ master ]   # masterブランチにpushされたら実行
  repository_dispatch:     # MicroCMSのWebhookから実行
    types: [update]
  workflow_dispatch:       # 手動実行も可

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) ソースコードをチェックアウト
      - uses: actions/checkout@v4

      # 2) Node.js 環境をセットアップ
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3) 依存関係をインストール
      - run: npm ci

      # 4) Cloudflare環境変数を設定
      - run: |
          echo "MICROCMS_API_KEY=${{ secrets.MICROCMS_API_KEY }}" >> .env.production
          echo "MICROCMS_SERVICE_ID=${{ secrets.MICROCMS_SERVICE_ID }}" >> .env.production
          echo "MICROCMS_ENDPOINT=${{ secrets.MICROCMS_ENDPOINT }}" >> .env.production
          echo "GOOGLE_ANALYTICS_ID=${{ secrets.GOOGLE_ANALYTICS_ID }}" >> .env.production

      # 5) ビルド
      - run: npm run build
        env:
          NODE_ENV: production

      # 6) Wrangler認証確認
      - name: Wrangler whoami (sanity check)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami

      # 7) Cloudflare Workers にデプロイ
      - run: npx wrangler deploy --env=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}