name = "my-awsome-site"
main = "src/worker/worker.ts"
compatibility_date = "2025-08-08"

# 本番のルーティング（workers.dev だけで良ければこの配列自体を消してOK）
routes = ["augustaro.com/*"]

[assets]
directory = "public"

# 本番の DO バインド
[durable_objects]
bindings = [{ name = "COUNTER_DO", class_name = "CounterDO" }]

# 本番の DO migration（Freeは SQLite 必須）
[[migrations]]
tag = "v2-counter-sqlite"
new_sqlite_classes = ["CounterDO"]

[build]
command = "npm run build"

# ---------------- dev 環境 ----------------
[env.dev]
name = "my-awesome-site-dev"        # ← typo 直した（awesome）
# workers.dev で使うなら routes は不要。独自ドメインを使うなら下の行を残す
# routes = ["dev.augustaro.com/*"]

# dev の DO バインド（継承されないので必須）
[env.dev.durable_objects]
bindings = [{ name = "COUNTER_DO", class_name = "CounterDO" }]

# dev の DO migration（別サービス名なのでこれも必要）
[[env.dev.migrations]]
tag = "v2-counter-sqlite"
new_sqlite_classes = ["CounterDO"]